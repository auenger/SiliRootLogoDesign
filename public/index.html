<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiliRoot Logo Design</title>
  <link rel="icon" href="./logo-favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light;--ink:#171919;--muted:#6f7777;--line:#d8dddd;--accent:#087b6c;--paper:#fff;--ground:#f2f4f4}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif}main{max-width:1240px;margin:auto;padding:36px 28px 64px}.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:26px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px;color:inherit;text-decoration:none}.brand img{width:48px;height:48px}.brand strong{display:block;font-size:19px;letter-spacing:.12em}.brand small{display:block;margin-top:4px;font-size:10px;letter-spacing:.25em}.nav>a{color:var(--muted);font-size:13px;text-underline-offset:5px}.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(420px,1.1fr);align-items:center;gap:8vw;padding:76px 0 64px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.18em}.hero h1{max-width:650px;margin:18px 0;font-size:clamp(42px,6vw,78px);line-height:.98;letter-spacing:-.055em;font-weight:580}.hero p{max-width:550px;color:var(--muted);line-height:1.85;font-size:15px}.hero img{width:100%;height:auto}.projects{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{display:grid;min-height:300px;padding:30px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:inherit;text-decoration:none;transition:transform .2s ease,border-color .2s ease}.card:hover{transform:translateY(-3px);border-color:#929a9a}.card small{color:var(--accent);letter-spacing:.14em}.card h2{align-self:end;margin:0 0 10px;font-size:30px;letter-spacing:-.035em}.card p{margin:0;color:var(--muted);line-height:1.7}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:52px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer a{color:inherit;text-underline-offset:4px}@media(max-width:760px){main{padding:24px 16px 44px}.hero{grid-template-columns:1fr;padding:52px 0}.hero img{order:-1}.projects{grid-template-columns:1fr}.card{min-height:240px}.footer{flex-direction:column}}
  </style>
</head>
<body><main>
  <nav class="nav"><a class="brand" href="./index.html"><img src="./logo-mark.svg" alt=""><span><strong>硅基源流</strong><small>SiliRoot</small></span></a><a href="https://siliroot.com/">公司官网</a></nav>
  <section class="hero"><div><div class="eyebrow">SILIROOT / LOGO DESIGN</div><h1>从标准几何，到一个完整标志。</h1><p>SiliRoot 的 Logo 设计衍生小工具前端项目。查看 SR 标志如何由圆、直线和切线构建，或输入两个字母，探索新的共形组合。</p></div><img src="./logo-horizontal.svg" alt="硅基源流 SiliRoot 横版 Logo"></section>
  <section class="projects" aria-label="设计工具"><a class="card" href="./logo-lab.html"><small>01 / GEOMETRY LAB</small><div><h2>Logo 设计</h2><p>逐步查看 SR 标志的标准圆、直边、相切接点与渐进填黑过程。</p></div></a><a class="card" href="./monogram-mvp/index.html"><small>02 / MONOGRAM TOOL</small><div><h2>双字母设计工具</h2><p>输入任意两个英文字母，生成六种重叠、切除和负空间关系。</p></div></a></section>
  <footer class="footer"><span>© 2026 苏州硅基源流人工智能</span><a href="https://github.com/auenger/SiliRootLogoDesign">GitHub 源码</a></footer>
</main></body>
</html>
